kind = "web"
previewPath = "/"
title = "SOMA APP"
version = "1.0.0"
id = "artifacts/soma-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22202

[services.development]
run = "pnpm --filter @workspace/soma-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soma-app", "run", "build" ]
publicDir = "artifacts/soma-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22202"
BASE_PATH = "/"
